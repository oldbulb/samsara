# The samsara bundle patch: layered over @deepseek-ai/dsh-base by
# `profiles/host/package.json` (dsh.profile.bundles). Every row is plain data
# (E3: no !!js); the runner reads its request from the `samsaraRun` service
# that the startup row provides, never from config.

- insert:
    # Storage: dsh-base mounts none, so the bundle brings the hub, the sqlite
    # backend and the domain facility. The ledger domain (`samsara_ledger`)
    # lands at `path`, a literal resolved against the cwd the host was launched
    # from (E3: no !!js), i.e. the repo's gitignored data/ dir when running
    # from the checkout; pin an absolute location in the profile's own patch
    # layer. One host writes it (E6: single writer is a deployment rule, not
    # enforced by a lock); `dsh --profile host ledger backup --out <file>`
    # copies it with sqlite's online backup API while the host runs. The hub
    # and the facility carry the bundle's own ids: a profile
    # that also loads dsh-web-app (which inserts `storage`/`storage-domain`
    # under its own) disables these two and routes the domain through its
    # facility (the loader rejects a duplicate id before it reads `disabled`).
    - id: samsara-storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-sqlite
      name: '@deepseek-ai/dsh-storage-sqlite'
      inject: [storage]
      config:
        path: data/ledger/samsara_ledger.sqlite

    - id: samsara-storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      inject: [storage]
      config:
        backend: sqlite
        routes:
          samsara_ledger: sqlite

    # ctx.ledger: the one control-plane record, on the samsara_ledger domain.
    - id: ledger
      name: '@oldbulb/samsara-ledger'
      inject: [storageDomain]

    # ctx.gate: the registry of gate policies; gate-default registers on it.
    - id: gate
      name: '@oldbulb/samsara-gate'

    # The catalog rules (@oldbulb/samsara-gate-catalog: keep-better, hillclimb,
    # …; every rule when `policies` is omitted) are policies only when a profile
    # mounts them; `gate bench` reads the catalog directly. Mounted here, before
    # gate-default, they judge as shadows (a compare row beside the promotion
    # verdict, no verdict of their own) and `--gate-policy <name>` can name
    # them. Mounted after gate-default, the last one is the promotion gate and
    # needs a `gate_change` consent before anything opens.
    # - id: gate-catalog
    #   name: '@oldbulb/samsara-gate-catalog/plugin'
    #   inject: [gate]
    #   config:
    #     policies: [keep-better, hillclimb]

    - id: gate-default
      name: '@oldbulb/samsara-gate/plugin-default'
      inject: [gate]

    # A gate in any language, as a subprocess (stdin: CompareRequest JSON,
    # stdout: GateJudgement JSON; contract in examples/gates/README.md). The
    # most recently registered policy is the one that judges, so this row
    # after gate-default replaces it; running rounds under a non-default gate
    # is a consent action (`gate_change`, architecture.md § Ledger).
    # - id: gate-mine
    #   name: '@oldbulb/samsara-gate/plugin-command'
    #   inject: [gate]
    #   config:
    #     command: ./my_gate.py
    #     name: mine
    #     version: 0.1.0

    # ctx.loops: the registry every loop provider registers on.
    - id: loops
      name: '@oldbulb/samsara-loops'

    # The null loop: a provider that finishes at once without an LLM; smoke tests the seam.
    # `submit` is a canned submission every attempt leaves behind (null: none), for a
    # pack whose truth needs a submission but does not read the answer.
    - id: loops-null
      name: '@oldbulb/samsara-loops/plugin-null'
      inject: [loops]
      config:
        submit: null

    # In-process dsh child agent.
    - id: loops-dsh
      name: '@oldbulb/samsara-loops-dsh'
      inject: [loops]

    # Claude Agent SDK under the kernel's subprocess projection. Off by default:
    # the SDK is proprietary ("© Anthropic PBC, all rights reserved") and is an
    # optional peer, so nothing installs it for you. To use this loop, install it
    # into the profile and flip the row:
    #   dsh plugin --profile <name> add @anthropic-ai/claude-agent-sdk
    #   - { id: loops-claude-code, disabled: false, config: { baseUrl: …, credentialRef: … } }
    # The credential is a reference resolved through ctx.credentials (E5); the
    # base URL is the external gateway. Both are deployment facts.
    - id: loops-claude-code
      name: '@oldbulb/samsara-loops-claude-code'
      inject: [loops]
      disabled: true
      config:
        baseUrl: ''
        credentialRef: ''

    # An agent installed in the environment's image, run there through the
    # environment's exec: the loop `--env docker|modal|…` needs (the loops
    # above run on this host and need `local`; packages/loops/README.md).
    # `command` takes `{workdir}`, `{skill}` and `{attempt}` (the token file)
    # as paths inside the environment; `transcript` / `submit` name paths
    # inside it fetched back as the transcript artifact and the submit file.
    # Off by default: the image must carry the agent. The example is the
    # oracle of a Harbor-style task — its own solution script.
    - id: loops-installed
      name: '@oldbulb/samsara-loops/plugin-installed'
      inject: [loops]
      disabled: true
      config:
        command: [bash, /solution/solve.sh]

    # ctx.environments: the registry every environment provider registers on
    # (where an attempt runs; docs/design/notes/environments-harbor-modal-2026-08-26.md).
    - id: environments
      name: '@oldbulb/samsara-environments'

    # A directory on this host, children through the kernel's subprocess seam
    # under the sandbox policy: today's behaviour behind the seam, the default.
    - id: environments-local
      name: '@oldbulb/samsara-environments/plugin-local'
      inject: [environments, subprocess]

    # A container per environment through the docker CLI. Off by default: it
    # needs a docker daemon reachable from the host; flip the row where one is.
    - id: environments-docker
      name: '@oldbulb/samsara-environments/plugin-docker'
      inject: [environments, subprocess]
      disabled: true
      config:
        docker: docker

    # A Modal sandbox per environment through the `modal` SDK. Off by default:
    # it needs a Modal account — credentials from MODAL_TOKEN_ID /
    # MODAL_TOKEN_SECRET or ~/.modal.toml, or the variable names in config
    # (tokenIdEnv / tokenSecretEnv); `app` names the Modal App.
    - id: environments-modal
      name: '@oldbulb/samsara-environments/plugin-modal'
      inject: [environments]
      disabled: true
      config:
        app: samsara

    # ctx.proposers: the registry every proposer adapter registers on.
    - id: proposers
      name: '@oldbulb/samsara-proposers'

    # The operator as proposer: without a configured patch this registers
    # nothing; `round --proposer human --skill-dir … --intent …` supplies it.
    - id: proposer-human
      name: '@oldbulb/samsara-proposers/plugin-human'
      inject: [proposers]

    # `claude -p` as proposer, spawned through the kernel's subprocess seam with
    # an explicit env (E5). model/baseUrl/credentialRef are deployment facts
    # and live in the profile's own patch layer (like loops-claude-code); a
    # patch replaces the whole config, so the profile restates `command` too.
    - id: proposer-claude-p
      name: '@oldbulb/samsara-proposers/plugin-claude-p'
      inject: [proposers, subprocess, credentials]
      config:
        command: claude

    # Any executable as proposer (examples/proposers/README.md): spawned as
    # `<command> [args…] --view <dir> --out <dir>` through the kernel's
    # subprocess seam with an explicit env (E5); it writes proposal.json (and
    # skill/) into the out directory. One row per proposer, each under its own
    # `name`; a credential reaches the child only via credentialRef/credentialVar.
    # The child runs with cwd = its own work directory, so a script path in
    # `command`/`args` must be absolute (or `command` on PATH). In a profile
    # patch a new row goes under `- insert:`; a bare `- id:` patches an
    # existing row and is dropped when the id does not exist.
    # - id: proposer-noop
    #   name: '@oldbulb/samsara-proposers/plugin-command'
    #   inject: [proposers, subprocess, credentials]
    #   config:
    #     name: noop
    #     command: python3
    #     args: [/abs/path/to/samsara/examples/proposers/noop.py]
    #     timeoutMs: 600000

    # ctx.scopes: disposable child scopes for challengers (E1: in-memory loader rows only).
    - id: scopes
      name: '@oldbulb/samsara-scope'

    # ctx.signoff: the consent channel (E2). Literal paths resolved against the
    # launch cwd. Generate the keypair on the signer's side (`samsara-signoff
    # keygen --out <dir>`) and copy only signoff.pub here: a signoff.key beside
    # the public key makes the service refuse every proof (KEY_ON_HOST).
    - id: signoff
      name: '@oldbulb/samsara-signoff'
      config:
        socketPath: data/signoff.sock
        publicKeyPath: data/signoff/signoff.pub

    # ctx.champion: owns the generated section of profiles/host/cordis.patch.yml.
    - id: champion
      name: '@oldbulb/samsara-champion'
      inject: [ledger, signoff]
      config:
        profileDir: profiles/host
        skillStore: data/skills

    # ctx.lifecycle: every transition of a challenger row and of a round
    # (propose/open/run/judge/decide/demote/settle); attempts run through the
    # executor the runner mounts on ctx.executor.
    - id: lifecycle
      name: '@oldbulb/samsara-lifecycle'
      inject: [ledger, scopes, gate, loops, champion]

    # Web carrier: the bundle inserts the webserver row itself (never
    # dsh-web-app, whose web-startup row would reject the runner's argv; see
    # docs/dsh-plugin-notes.md B4), under its own id so a profile that loads
    # dsh-web-app's `webserver` row can disable this one. Loopback only.
    - id: samsara-webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: 127.0.0.1
        port: 0   # OS-assigned so one-shot commands never collide; pin a port in the profile patch for `serve`

    # The read-only /samsara page and JSON API on ctx.webServer. Config comes
    # from this row, never from the command line.
    - id: samsara-ui
      name: '@oldbulb/samsara-ui'
      inject: [webServer, ledger, champion, signoff]
      config:
        basePath: /samsara
        refreshMs: 5000

    # Parses `dsh --profile host run ...` and provides ctx.samsaraRun.
    - id: samsara-run-startup
      name: '@oldbulb/samsara-runner/startup'

    # Runs the set; waits on the samsaraRun service instead of reading config.
    # Mounts runSet as ctx.executor; every transition goes through ctx.lifecycle.
    # subprocess: `propose --proposer ./command` spawns the proposer from this
    # row's context (a registered proposer row brings its own). environments:
    # one environment per attempt on the provider `--env` names (local by default).
    - id: samsara-runner
      name: '@oldbulb/samsara-runner'
      inject: [samsaraRun, ledger, lifecycle, subprocess, environments]
      config:
        baseUrl: ''
        credentialRef: ''
