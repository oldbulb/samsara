# The samsara bundle patch: layered over @deepseek-ai/dsh-base by
# `profiles/host/package.json` (dsh.profile.bundles). Every row is plain data
# (E3: no !!js); the runner reads its request from the `samsaraRun` service
# that the startup row provides, never from config.

- insert:
    # Storage: dsh-base mounts none, so the bundle brings the hub, the json
    # backend and the domain facility. The ledger domain (`samsara_ledger`)
    # lands at `<root>/samsara_ledger.json`; `root` is a literal path resolved
    # against the cwd the host was launched from (E3: no !!js), i.e. the repo's
    # gitignored data/ dir when running from the checkout. Override `root` in
    # the profile's own patch layer to pin an absolute location.
    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-sqlite
      name: '@deepseek-ai/dsh-storage-sqlite'
      inject: [storage]
      config:
        path: data/ledger/samsara_ledger.sqlite

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      inject: [storage]
      config:
        backend: sqlite
        routes:
          samsara_ledger: sqlite

    # ctx.ledger: the one control-plane record, on the samsara_ledger domain.
    - id: ledger
      name: '@samsara/ledger'
      inject: [storageDomain]

    # ctx.gate: the registry of gate policies; gate-default registers on it.
    - id: gate
      name: '@samsara/gate'

    - id: gate-default
      name: '@samsara/gate/plugin-default'
      inject: [gate]

    # ctx.loops: the registry every loop provider registers on.
    - id: loops
      name: '@samsara/loops'

    # The null loop: a provider that finishes at once without an LLM; smoke tests the seam.
    - id: loops-null
      name: '@samsara/loops/plugin-null'
      inject: [loops]

    # In-process dsh child agent.
    - id: loops-dsh
      name: '@samsara/loops-dsh'
      inject: [loops]

    # Claude Agent SDK under the kernel's subprocess projection. The credential
    # is a reference resolved through ctx.credentials (E5); the base URL is the
    # external LLM proxy. Override both in the profile's own patch layer.
    - id: loops-claude-code
      name: '@samsara/loops-claude-code'
      inject: [loops]
      config:
        baseUrl: ''
        credentialRef: ''

    # ctx.proposers: the registry every proposer adapter registers on.
    - id: proposers
      name: '@samsara/proposers'

    # The operator as proposer: without a configured patch this registers
    # nothing; `round --proposer human --skill-dir … --intent …` supplies it.
    - id: proposer-human
      name: '@samsara/proposers/plugin-human'
      inject: [proposers]

    # `claude -p` as proposer, spawned through the kernel's subprocess seam with
    # an explicit env (E5). model/baseUrl/credentialRef are deployment facts
    # and live in the profile's own patch layer (like loops-claude-code); a
    # patch replaces the whole config, so the profile restates `command` too.
    - id: proposer-claude-p
      name: '@samsara/proposers/plugin-claude-p'
      inject: [proposers, subprocess, credentials]
      config:
        command: claude

    # ctx.scopes: disposable child scopes for challengers (E1: in-memory loader rows only).
    - id: scopes
      name: '@samsara/scope'

    # ctx.signoff: the consent channel (E2). Literal paths resolved against the
    # launch cwd; generate the key with `samsara-signoff keygen --out data/signoff`.
    - id: signoff
      name: '@samsara/signoff'
      config:
        socketPath: data/signoff.sock
        publicKeyPath: data/signoff/signoff.pub

    # ctx.champion: owns the generated section of profiles/host/cordis.patch.yml.
    - id: champion
      name: '@samsara/champion'
      inject: [ledger, signoff]
      config:
        profileDir: profiles/host
        skillStore: data/skills

    # Web carrier: the bundle inserts the webserver row itself (never
    # dsh-web-app, whose web-startup row would reject the runner's argv; see
    # docs/dsh-plugin-notes.md B4). Loopback only.
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: 127.0.0.1
        port: 0   # OS-assigned so one-shot commands never collide; pin a port in the profile patch for `serve`

    # The read-only /samsara page and JSON API on ctx.webServer. Config comes
    # from this row, never from the command line.
    - id: samsara-ui
      name: '@samsara/ui'
      inject: [webServer, ledger, champion, signoff]
      config:
        basePath: /samsara
        refreshMs: 5000

    # Parses `dsh --profile host run ...` and provides ctx.samsaraRun.
    - id: samsara-run-startup
      name: '@samsara/runner/startup'

    # Runs the set; waits on the samsaraRun service instead of reading config.
    - id: samsara-runner
      name: '@samsara/runner'
      inject: [samsaraRun, ledger]
      config:
        baseUrl: ''
        credentialRef: ''
