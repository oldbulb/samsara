name: coding-tasks
truth_latency: immediate
skill: { dir: skill/, name: fix }
contract: contract.schema.json
tasks:
  sets: { smoke: tasks/smoke.jsonl, holdin: tasks/holdin.jsonl, holdout: tasks/holdout.jsonl }
  entity_key: entity_key
  version: 1
  stratum_key: stratum
holdout:
  mde: 0.05
  budget: 8
surfaces:
  skill: { globs: ["skill/**"] }
# What truth/score/materialize and the attempts execute from: the four
# provisioned runtimes (runtime/provision.sh), granted read-only to the
# sandboxed subprocess; the lock files pin them into env_sha (E3); the three
# names are the only host variables the commands may read beside the defaults.
runtime:
  dirs: [runtime/py, runtime/js, runtime/go, runtime/rust]
  locks: ["runtime/py/requirements.txt", "runtime/js/package.json", "runtime/js/pnpm-lock.yaml"]
  env: [CODING_TASKS_PYTHON, CODING_TASKS_GO, CODING_TASKS_CARGO]
commands:
  truth: ./bin/truth
  score: ./bin/score
  materialize: ./bin/materialize
guards:
  deny_patterns: ["--as-of"]
