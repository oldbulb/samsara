name: synthetic
truth_latency: immediate
skill: { dir: skill/, name: answer }
contract: contract.schema.json
tasks:
  sets: { smoke: tasks/smoke.jsonl, holdin: tasks/holdin.jsonl, holdout: tasks/holdout.jsonl }
  entity_key: entity_key
  version: 1
  stratum_key: stratum
holdout:
  mde: 0.05
  # one reveal per challenger run on the held-out set, counted across the ledger; the README recipe spends 22
  # (20 A/A rounds + the injected round + control aa), tests/synthetic.e2e.test.ts up to 21
  budget: 24
surfaces:
  skill: { globs: ["skill/**"] }
# Where an attempt runs under `--env docker` (README "In a container"); under
# `--env local` (the default) the image is not used and truth is a host subprocess.
environment: { image: 'node:22-slim', network: none }
commands:
  truth: { run: ./bin/truth.mjs, in_environment: true }
  score: ./bin/score.mjs
  materialize: ./bin/materialize.mjs
