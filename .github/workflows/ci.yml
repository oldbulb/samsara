# The offline gate. Everything here runs without a model and without the LLM
# gateway: the dsh replay test skips when no dsh checkout is around to supply
# llm-replay, and everything else is pure TS or the coding-tasks pack's own
# runtimes. Real loops are never run in CI.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'

      - name: enable pnpm
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The coding-tasks e2e drives the pack for real: pytest, jest, go and cargo
      # must be there, and the runtimes are gitignored (they are installs, not
      # source). The runner image ships go and cargo; the script installs the rest.
      - name: provision the pack runtimes
        run: packs/coding-tasks/runtime/provision.sh

      - run: pnpm test

      # Twenty null rounds must promote nothing (S1/S4); the default three are a smoke.
      - name: A/A gate (20 seeds)
        run: SAMSARA_E2E_AA_ROUNDS=20 pnpm vitest run tests/synthetic.e2e.test.ts

      # The pack's environment block for real: three smoke attempts in
      # node:22-slim through the docker provider, truth inside the container.
      # ubuntu-latest ships a daemon; the describe skips wherever one is missing.
      - name: synthetic pack in docker
        run: pnpm vitest run tests/synthetic.e2e.test.ts -t docker

      # A Harbor task as a pack, for real: hello-world's own image built by
      # the docker provider, the installed loop running its oracle, truth
      # (tests/test.sh) inside — reward 1; a loop that does nothing — reward 0.
      - name: harbor hello-world under docker
        run: pnpm vitest run tests/harbor.e2e.test.ts

  leak-scan:
    # Boundary discipline 1: packages/ must not know the domain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ops/leak-scan.sh
