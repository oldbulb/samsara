[project]
name = "samsara-proposer"
version = "0.1.0"
description = "Write a samsara proposer in Python: load the rendered view, build a Proposal, validate it, write it out. Standard library only."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["samsara_proposer"]
