# samsara host profile — the user patch layer over dsh-base + the samsara bundle.
# This file is what `dsh --profile host` boots; the champion's kept rows are
# merged here by the champion plugin. Hand-written rows below are the fixed
# deployment facts: the LLM route and the default model.

# LLM route: gateway (the LLM gateway gateway) reached on the anthropic-messages wire.
# The credential is a reference resolved per request through ctx.credentials
# ($DSH_HOME/.credentials.yaml or the environment); no secret lives here.
- id: llm-pi-ai
  config:
    providers:
      gateway:
        displayName: gateway
        api: anthropic-messages
        baseURL: http://internal.example
        apiKeyEnv: LLM_GATEWAY_API_KEY
        headers:
          X-Gateway-Lane: default
        models:
          - id: deepseek-v4-flash
            name: DeepSeek-V4-Flash (gateway)
            contextWindow: 262144
            maxTokens: 32768

- id: agent-default-model
  config:
    provider: gateway
    model: deepseek-v4-flash

# Loop provider claude-code: route the Claude Agent SDK at the same gateway
# gateway; the credential is a reference (E5), resolved through ctx.credentials.
# Price table for cost attribution on the in-process loop (USD per Mtok;
# assumed deepseek-v4-flash list prices, see docs/design/notes/round-cost-model.md).
- id: loops-dsh
  config:
    pricePerMtok: { input: 0.28, output: 0.42, cacheRead: 0.028 }

- id: loops-claude-code
  config:
    baseUrl: http://internal.example
    credentialRef: LLM_GATEWAY_API_KEY

# Proposer claude-p: the same gateway and credential reference as the loop.
# A patch replaces the row's whole config, so command/model are restated here.
- id: proposer-claude-p
  config:
    command: claude
    model: deepseek-v4-flash
    baseUrl: http://internal.example
    credentialRef: LLM_GATEWAY_API_KEY

# The runner copies the same route facts into every AttemptSpec.
- id: samsara-runner
  config:
    baseUrl: http://internal.example
    credentialRef: LLM_GATEWAY_API_KEY
